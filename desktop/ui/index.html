<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http:; media-src https: http:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>镜库 · 视频创作参考</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#main"><span class="brand-mark">镜</span><span>镜库<small>视频创作参考</small></span></a>
    <button id="browse" class="nav-button active">全部内容 <span>↗</span></button>
    <div class="sidebar-label">从拍法开始</div>
    <nav id="categories" aria-label="拍法快捷搜索"></nav>
    <div class="sidebar-bottom"><button id="settings-open" class="nav-button">模型设置 <span>＋</span></button><button id="refresh" class="nav-button">刷新本地库 <span>↻</span></button><p id="library-info">正在读取本地库</p><p id="data-version" class="version"></p></div>
  </aside>
  <main id="main">
    <header class="page-header"><span class="eyebrow">LOCAL VIDEO LIBRARY</span><span class="keyboard-hint"><kbd>Ctrl</kbd> <kbd>K</kbd> 搜索</span></header>
    <section class="search-area" aria-labelledby="page-title">
      <h1 id="page-title">把想法，变成画面。</h1>
      <p>描述你想拍的主题、氛围或动作，寻找可复用的模板与真实案例。</p>
      <form id="search-form" class="search-form"><label class="sr-only" for="query">视频主题或方向</label><input id="query" type="search" placeholder="例如：赛博朋克街头，一只猫的产品广告" maxlength="1000" autocomplete="off"><button id="search-button" type="submit">搜索参考 <span>→</span></button></form>
      <div class="search-status"><span id="status" role="status" aria-live="polite">正在读取本地库…</span><div class="status-actions"><button id="cancel" hidden>取消</button><button id="retry" hidden>重试 Agent</button></div></div>
      <p id="intent" class="intent" hidden></p>
      <section id="clarification" class="clarification" hidden aria-label="补充意图"><p id="question"></p><div id="question-options"></div><form id="answer-form"><label class="sr-only" for="answer">补充说明</label><input id="answer" placeholder="也可以补充一句说明" maxlength="1000"><button type="submit">继续匹配</button><button id="skip" type="button" class="secondary">跳过</button></form></section>
    </section>
    <section class="results-section" aria-labelledby="templates-title"><div class="section-header"><h2 id="templates-title">提示词模板 <span id="template-count"></span></h2><button id="more-templates" class="more-templates" hidden>更多模板</button></div><div id="templates" class="template-grid"></div></section>
    <section class="results-section" aria-labelledby="cases-title"><div class="section-header"><h2 id="cases-title">案例参考 <span id="case-count"></span></h2><span class="section-note">打开查看视频与原始提示词</span></div><div id="cases" class="case-grid"></div><button id="load-more" class="load-more" hidden>查看更多案例</button></section>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
  </main>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><header class="dialog-header"><span id="detail-kind" class="eyebrow"></span><button class="close" data-close="detail-dialog" aria-label="关闭详情">×</button></header><div id="detail-content"></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"><header class="dialog-header"><span class="eyebrow">MODEL CONNECTION</span><button class="close" data-close="settings-dialog" aria-label="关闭设置">×</button></header><h2 id="settings-title">连接你的 Agent</h2><p class="muted">使用支持 OpenAI Chat Completions 协议的服务。调用由本机完成。</p><form id="settings-form"><label for="base-url">服务地址</label><input id="base-url" type="url" placeholder="https://api.example.com/v1" required><label for="model">模型名称</label><input id="model" placeholder="服务提供的模型 ID" required maxlength="200"><label for="api-key">API Key</label><input id="api-key" type="password" placeholder="输入新 Key；留空保留已有 Key" autocomplete="new-password"><label class="checkbox"><input id="clear-key" type="checkbox"> 清除已有 Key</label><p id="key-status" class="muted"></p><div class="settings-actions"><button id="settings-save" type="submit">保存配置</button><button id="connection-test" class="secondary" type="button">保存并测试连接</button></div><p id="settings-status" role="status" aria-live="polite"></p></form></dialog>
</body>
</html>
